<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del bot</title>
<link rel="icon" type="image/png" sizes="16x16" href="/panel/icono/icono-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/panel/icono/icono-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/panel/icono/icono-48.png">
<link rel="icon" type="image/png" sizes="128x128" href="/panel/icono/icono-128.png">
<link rel="icon" type="image/png" sizes="256x256" href="/panel/icono/icono-256.png">
<style>
  /* Dos paneles como WhatsApp Web: la lista a la izquierda, la conversacion
     a la derecha. Sin tipografias de internet: el panel se abre justo cuando
     algo va mal, y a veces lo que va mal es la red. La pila del sistema en
     Windows es Segoe UI, que es con la que se ve WhatsApp Web aqui. */
  :root {
    color-scheme: light;
    --fondo: #eae6df;
    --panel: #ffffff;
    --barra: #f0f2f5;
    --borde: #e9edef;
    --borde-fuerte: #d1d7db;
    --tinta: #111b21;
    --tinta-2: #667781;
    --tinta-3: #8696a0;
    /* El acento es azul, no el verde de WhatsApp: se toma prestada la
       disposicion, no la marca -- y el azul es el de Honor. */
    --acento: #1877c9;
    --acento-fuerte: #0f5ba6;
    --burbuja-entra: #ffffff;
    --burbuja-sale: #d6e9fb;
    /* Las palomitas y el texto dentro de una burbuja de color llevan su
       propio tono: el gris neutro se apaga sobre el fondo teñido. */
    --palomas: #1877c9;
    --tinta-en-burbuja: #667781;
    --tinta-en-fallo: #667781;
    --seleccion: #f0f2f5;
    --alto: #ea0038;
    --alto-suave: #ffe5ea;
    --aviso: #b26b00;
    --aviso-suave: #fff3e0;
    --ok-suave: #e6f0fb;
    --sombra: 0 1px 0.5px rgba(11,20,26,.13);
    /* El azul del logo. Es del logo, no de la interfaz: no cambia
       con el tema ni sigue al acento. */
    --marca: #00B1FF;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --trazo-doodle: rgba(17,27,33,.05);
  }
  /* El tema tiene TRES estados, no dos: mientras nadie elija, se sigue al
     sistema (el media query); en cuanto el boton elige, manda la eleccion
     (el selector de abajo). Sin el segundo bloque, el boton cambia el
     atributo y no pasa nada visible -- que es justo lo que pasaba. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fondo: #0b141a;
    --panel: #111b21;
    --barra: #202c33;
    --borde: #202c33;
    --borde-fuerte: #2a3942;
    --tinta: #e9edef;
    --tinta-2: #8696a0;
    --tinta-3: #667781;
    --acento: #53a6f0;
    --acento-fuerte: #53a6f0;
    --burbuja-entra: #202c33;
    --burbuja-sale: #0b4a7a;
    --palomas: #53bdeb;
    --tinta-en-burbuja: #c2d3d8;
    --tinta-en-fallo: #c2a8ae;
    --seleccion: #2a3942;
    --alto: #f15c6d;
    --alto-suave: #3b1a21;
    --aviso: #e3ae5a;
    --aviso-suave: #33260f;
    --ok-suave: #10283a;
    --sombra: 0 1px 0.5px rgba(11,20,26,.38);
    --trazo-doodle: rgba(233,237,239,.04);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fondo: #0b141a;
    --panel: #111b21;
    --barra: #202c33;
    --borde: #202c33;
    --borde-fuerte: #2a3942;
    --tinta: #e9edef;
    --tinta-2: #8696a0;
    --tinta-3: #667781;
    --acento: #53a6f0;
    --acento-fuerte: #53a6f0;
    --burbuja-entra: #202c33;
    --burbuja-sale: #0b4a7a;
    --palomas: #53bdeb;
    --tinta-en-burbuja: #c2d3d8;
    --tinta-en-fallo: #c2a8ae;
    --seleccion: #2a3942;
    --alto: #f15c6d;
    --alto-suave: #3b1a21;
    --aviso: #e3ae5a;
    --aviso-suave: #33260f;
    --ok-suave: #10283a;
    --sombra: 0 1px 0.5px rgba(11,20,26,.38);
    --trazo-doodle: rgba(233,237,239,.04);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.45 var(--sans);
    color: var(--tinta);
    background: var(--barra);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* --- armazon de dos paneles --- */
  .app {
    /* Al alto de la ventana, no al 100% del padre: con el porcentaje, en
       Edge el armazon quedaba mas corto que la ventana y el pie del panel
       se salia de la vista. */
    height: 100vh;
    display: grid;
    grid-template-columns: minmax(300px, 31%) 1fr;
    /* La fila mide la ventana y nada mas. Sin esto la fila (y con ella el
       panel de la derecha) crecia con la conversacion: una de 100 turnos
       media 14 000 px, se desplazaba la pagina entera y la barra de arriba
       y la lista se iban con ella, en vez de desplazarse solo el chat. */
    grid-template-rows: minmax(0, 1fr);
    background: var(--panel);
  }
  .lateral {
    display: flex; flex-direction: column;
    border-right: 1px solid var(--borde);
    background: var(--panel);
    min-width: 0;
    min-height: 0;
  }
  .principal {
    display: flex; flex-direction: column;
    background: var(--fondo);
    min-width: 0;
    min-height: 0;
  }
  .principal > .doodle, .principal > .hoja, .principal > .logs { min-height: 0; }

  /* --- barra superior, igual en los dos paneles --- */
  .barra {
    background: var(--barra);
    padding: 9px 16px;
    display: flex; align-items: center; gap: 12px;
    min-height: 59px;
    flex: none;
    border-bottom: 1px solid var(--borde);
  }
  .marca { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .nombre { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lugar { color: var(--tinta-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Los dos interruptores de la barra: tema e idioma. */
  .ajustes { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
  .ajustes button {
    border: 1px solid var(--borde-fuerte); background: none; color: var(--tinta-2);
    border-radius: 15px; cursor: pointer; font-size: 12px; font-weight: 600;
    padding: 4px 9px; display: inline-flex; align-items: center; gap: 5px;
  }
  .ajustes button:hover { border-color: var(--acento); color: var(--acento-fuerte); }
  .ajustes button:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  .ajustes button svg { fill: currentColor; }
  .ajustes .lengua span { padding: 0 1px; }
  .ajustes .lengua .activa { color: var(--acento-fuerte); }
  .ajustes .lengua .apagada { opacity: .45; }

  .pulso {
    margin-left: auto; display: flex; align-items: center; gap: 7px;
    color: var(--tinta-2); font-size: 12.5px; white-space: nowrap;
  }
  .foco { width: 9px; height: 9px; border-radius: 50%; background: var(--tinta-3); flex: none; }
  .foco.vivo { background: var(--acento); }
  .foco.muerto { background: var(--alto); }

  /* --- avatar --- */
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    background: var(--borde-fuerte); color: var(--panel);
    display: grid; place-items: center;
    font-size: 13px; font-weight: 600; letter-spacing: .01em;
  }
  .avatar.chico { width: 38px; height: 38px; font-size: 12px; }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  /* En la ficha del usuario el avatar se puede tocar para cambiar la foto. */
  button.avatar { padding: 0; border: none; cursor: pointer; position: relative; }
  button.avatar:hover::after {
    content: "cambiar"; position: absolute; inset: 0; border-radius: 50%;
    background: rgba(11,20,26,.62); color: #fff; font-size: 10px; font-weight: 600;
    display: grid; place-items: center; letter-spacing: .02em;
  }
  button.avatar:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .avatar.acento { background: var(--acento); color: #fff; }
  .avatar.marca { background: var(--marca); }

  /* --- buscador y solapas --- */
  .herramientas { padding: 8px 12px; display: flex; flex-direction: column; gap: 9px; flex: none; }
  .buscador { position: relative; }
  .buscador input {
    width: 100%; border: none; border-radius: 8px;
    background: var(--barra); color: var(--tinta);
    padding: 9px 12px 9px 40px; font: inherit; font-size: 14px;
  }
  .buscador input:focus-visible { outline: 2px solid var(--acento); }
  .buscador svg { position: absolute; left: 14px; top: 11px; fill: var(--tinta-3); }

  /* Cuatro solapas en UNA fila, del mismo ancho: icono arriba, nombre
     abajo. Antes eran pastillas de texto y "Calificaciones" caia sola a un
     segundo renglon. El numero va en un circulo sobre el icono, y solo
     cuando hay algo que mirar: su color dice que tan urgente es. */
  .solapas {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;
    background: var(--barra); border-radius: 12px; padding: 4px;
  }
  .solapas button {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: none; background: transparent; color: var(--tinta-2); min-width: 0;
    border-radius: 9px; padding: 7px 2px 6px; font: inherit; cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .solapas button:hover { color: var(--tinta); }
  .solapas button[aria-selected="true"] {
    background: var(--panel); color: var(--acento-fuerte); box-shadow: var(--sombra);
  }
  .solapas button:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  .solapas .icono { position: relative; display: block; width: 22px; height: 22px; }
  .solapas .icono svg { width: 22px; height: 22px; fill: currentColor; display: block; }
  .solapas .etiqueta {
    font-size: 11.5px; line-height: 1.2; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .solapas button[aria-selected="true"] .etiqueta { font-weight: 600; }
  .solapas .cuenta {
    position: absolute; top: -6px; left: 14px; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; font-size: 10.5px; font-weight: 700; line-height: 18px; text-align: center;
    font-variant-numeric: tabular-nums; color: #fff; background: var(--acento);
    box-shadow: 0 0 0 2px var(--barra);
  }
  .solapas .cuenta:empty { display: none; }
  .solapas .cuenta.alto { background: var(--alto); }
  .solapas .cuenta.aviso { background: var(--aviso); }
  .solapas button[aria-selected="true"] .cuenta { box-shadow: 0 0 0 2px var(--panel); }

  /* --- lista lateral --- */
  .lista { overflow-y: auto; flex: 1; }
  .renglon {
    display: flex; gap: 13px; align-items: center; width: 100%;
    padding: 10px 16px; border: none; background: none; cursor: pointer;
    text-align: left; border-bottom: 1px solid var(--borde);
  }
  .renglon:hover { background: var(--seleccion); }
  .renglon[aria-current="true"] { background: var(--seleccion); }
  .renglon:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
  .renglon .centro { flex: 1; min-width: 0; }
  .renglon .arriba { display: flex; align-items: baseline; gap: 8px; }
  .renglon .titulo {
    font-size: 16px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .renglon .hora { font-size: 12px; color: var(--tinta-2); flex: none; font-variant-numeric: tabular-nums; }
  .renglon .abajo { display: flex; align-items: center; gap: 7px; color: var(--tinta-2); font-size: 14px; }
  .renglon .vista-previa { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .renglon .globo {
    background: var(--acento); color: #fff; border-radius: 11px; flex: none;
    font-size: 12px; font-weight: 600; padding: 1px 7px; min-width: 21px; text-align: center;
  }
  .escribiendo { color: var(--acento); }
  .fijado { background: var(--ok-suave); }

  /* --- conversacion --- */
  .doodle {
    flex: 1; overflow-y: auto; padding: 18px 6% 22px;
    background-color: var(--fondo);
    background-image: var(--patron);
    background-size: 340px;
  }
  .anteriores {
    display: block; margin: 0 auto 16px; cursor: pointer;
    background: var(--barra); color: var(--acento-fuerte); font-weight: 600;
    border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px;
    box-shadow: var(--sombra);
  }
  .anteriores:hover { filter: brightness(.97); }
  .anteriores:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .anteriores[disabled] { cursor: default; color: var(--tinta-2); }

  .dia {
    display: block; width: fit-content; margin: 0 auto 16px;
    background: var(--barra); color: var(--tinta-2);
    font-size: 12.5px; padding: 5px 12px; border-radius: 8px; box-shadow: var(--sombra);
  }
  .turno { margin-bottom: 16px; }
  .burbuja {
    max-width: min(76%, 700px); padding: 7px 10px 8px;
    border-radius: 8px; box-shadow: var(--sombra); position: relative;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .burbuja.entra { background: var(--burbuja-entra); border-top-left-radius: 0; margin-right: auto; }
  .burbuja.sale { background: var(--burbuja-sale); border-top-right-radius: 0; margin-left: auto; }
  .burbuja.sale .pie-burbuja { color: var(--tinta-en-burbuja); }
  .burbuja.fallo .pie-burbuja { color: var(--tinta-en-fallo); }
  /* La colita de las burbujas. */
  .burbuja::before { content: ""; position: absolute; top: 0; width: 9px; height: 13px; }
  .burbuja.entra::before {
    left: -9px;
    background: radial-gradient(circle at 0 0, transparent 9px, var(--burbuja-entra) 9px);
  }
  .burbuja.sale::before {
    right: -9px;
    background: radial-gradient(circle at 100% 0, transparent 9px, var(--burbuja-sale) 9px);
  }
  .burbuja.fallo { background: var(--alto-suave); }
  .burbuja.fallo::before {
    background: radial-gradient(circle at 100% 0, transparent 9px, var(--alto-suave) 9px);
  }

  .pie-burbuja {
    float: right; margin: 6px -2px -3px 12px;
    font-size: 11px; color: var(--tinta-2);
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  /* La reaccion del usuario, como en WhatsApp: un globito colgando
     de la esquina de la respuesta. */
  .burbuja.con-reaccion { margin-bottom: 14px; }
  .reaccion {
    position: absolute; bottom: -14px; right: 12px;
    background: var(--panel); border: 1px solid var(--borde-fuerte); border-radius: 12px;
    padding: 0 6px; font-size: 14px; line-height: 22px; box-shadow: var(--sombra);
  }
  .reaccion.mala { border-color: var(--alto); }

  /* Deslizar para actualizar: el circulo que baja con el dedo y gira al
     soltar. Fijo y no dentro de cada lista, para no mover su contenido. */
  .recarga {
    position: fixed; z-index: 40; width: 38px; height: 38px; margin-left: -19px;
    border-radius: 50%; background: var(--panel); box-shadow: 0 2px 10px rgba(11,20,26,.25);
    display: grid; place-items: center; opacity: 0; pointer-events: none;
  }
  .recarga svg { width: 22px; height: 22px; }
  .recarga circle { fill: none; stroke: var(--acento); stroke-width: 2.6; stroke-linecap: round; }
  .recarga.volviendo { transition: transform .25s ease, opacity .25s ease; }
  .recarga.girando svg { animation: girar .8s linear infinite; }
  .recarga.listo circle { stroke: var(--acento-fuerte); }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .recarga.girando svg { animation-duration: 2.4s; }
  }

  .palomas { fill: var(--palomas); }
  .palomas.rojas { fill: var(--alto); }

  details.tramoya { clear: both; margin-top: 7px; }
  .traducir {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
    border: none; background: none; color: var(--acento-fuerte); font: inherit;
    font-size: 12.5px; cursor: pointer; padding: 2px 0;
  }
  .traducir:hover { text-decoration: underline; }
  .traducir:disabled { color: var(--tinta-2); cursor: default; text-decoration: none; }
  .traducir:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 4px; }
  .traducido { display: block; font-size: 11.5px; color: var(--tinta-en-burbuja); margin-bottom: 3px; }
  details.tramoya summary {
    cursor: pointer; font-size: 12.5px; color: var(--tinta-2);
    list-style: none; padding: 3px 0; user-select: none;
  }
  details.tramoya summary::-webkit-details-marker { display: none; }
  details.tramoya summary::before { content: "⚙ "; }
  details.tramoya summary:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .pasos {
    margin: 5px 0 0; padding: 9px 4px 9px 11px; list-style: none;
    background: var(--panel); border-radius: 7px; box-shadow: var(--sombra);
    font-size: 12px; line-height: 1.6; color: var(--tinta-2);
  }
  .pasos li {
    display: grid; grid-template-columns: 58px 16px 1fr; gap: 8px;
    align-items: start; padding: 2px 0;
  }
  .pasos .hora { font-family: var(--mono); color: var(--tinta-3); font-variant-numeric: tabular-nums; }
  .pasos .marca-paso { display: flex; justify-content: center; padding-top: 2px; }
  .pasos .marca-paso svg { fill: currentColor; }
  .pasos li.pensamiento .marca-paso { color: var(--tinta-3); }
  .pasos li.herramienta .marca-paso { color: var(--tinta-2); }
  .pasos li.sql .marca-paso { color: var(--tinta-2); }
  .pasos li.resultado .marca-paso { color: var(--acento); }
  .pasos li.error .marca-paso { color: var(--alto); }
  .pasos .texto { overflow-wrap: anywhere; white-space: pre-wrap; }
  /* Cada tipo de paso se reconoce de un vistazo sin leerlo. */
  .pasos li.sql .texto { font-family: var(--mono); color: var(--tinta); }
  .pasos li.pensamiento .texto { font-style: italic; }
  .pasos li.herramienta .texto { color: var(--tinta); }
  .pasos li.resultado .texto { color: var(--acento-fuerte); }
  .pasos li.error .texto { color: var(--alto); }
  /* Un renglon suelto, como los de las bitacoras viejas. */
  .pasos li.plano { grid-template-columns: 1fr; font-family: var(--mono); }

  .pie-panel {
    flex: none; background: var(--barra); padding: 13px 16px;
    color: var(--tinta-2); font-size: 13px; text-align: center;
    border-top: 1px solid var(--borde);
  }

  /* --- vistas que no son conversacion --- */
  .hoja { flex: 1; overflow-y: auto; background: var(--panel); }
  .hoja-interior { max-width: 760px; margin: 0 auto; padding: 24px 22px 44px; }
  .hoja h2 { font-size: 15px; font-weight: 600; margin: 0 0 5px; }
  .hoja h2.separada { margin-top: 30px; }
  .hoja p.nota { color: var(--tinta-2); font-size: 13.5px; margin: 0 0 18px; max-width: 62ch; }

  form.alta { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  label.campo { display: flex; flex-direction: column; gap: 5px; flex: 1 1 170px; }
  label.campo span { font-size: 12px; color: var(--tinta-2); }
  label.campo input {
    border: none; border-bottom: 2px solid var(--borde-fuerte);
    background: none; color: var(--tinta); padding: 7px 2px; font: inherit; width: 100%;
  }
  label.campo input:focus-visible { outline: none; border-bottom-color: var(--acento); }
  button.principal {
    background: var(--acento-fuerte); color: #fff; border: none; border-radius: 20px;
    padding: 9px 22px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button.principal:hover { filter: brightness(1.08); }
  button.principal:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

  /* Resumen de arriba: cuatro numeros que tambien filtran la lista. */
  .resumen-usuarios {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px;
  }
  button.cifra {
    font: inherit; text-align: left; cursor: pointer; color: var(--tinta);
    background: var(--panel); border: 1px solid var(--borde-fuerte); border-radius: 10px;
    padding: 11px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
  }
  button.cifra .numero { font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  button.cifra .que { font-size: 12.5px; color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.cifra:hover { border-color: var(--acento); }
  button.cifra[aria-pressed="true"] { border-color: var(--acento); background: var(--ok-suave); }
  button.cifra[aria-pressed="true"] .que { color: var(--acento-fuerte); }
  button.cifra:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  button.cifra.suspendidos .numero { color: var(--aviso); }

  .cabeza-lista { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .cabeza-lista .cuenta { font-size: 12.5px; color: var(--tinta-2); }

  .tarjeta-alta {
    margin-top: 30px; border: 1px dashed var(--borde-fuerte); border-radius: 12px; padding: 16px 18px 14px;
  }
  .tarjeta-alta .acceso { margin-top: 12px; }
  .tarjeta-alta p.nota { margin: 12px 0 0; font-size: 12.5px; }

  .persona {
    display: flex; align-items: center; gap: 13px;
    padding: 13px 4px; border-bottom: 1px solid var(--borde);
  }
  .persona:last-child { border-bottom: none; }
  .persona.suspendida .avatar, .persona.suspendida .nombre-persona { opacity: .55; }
  .persona .datos { flex: 1; min-width: 0; }
  .persona .quien { font-size: 15px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .persona .nombre-persona { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .persona .cuando { color: var(--tinta-2); font-size: 12.5px; margin-top: 1px; }
  .persona .cuando .reciente { color: var(--acento-fuerte); }
  .persona .rotulo-campo { display: block; font-size: 12px; color: var(--tinta-2); margin: 12px 0 4px; }
  .persona .rotulo-campo:first-child { margin-top: 0; }
  .persona .pie-edicion {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
    margin-top: 16px;
  }
  .persona .pie-edicion button.principal { padding: 8px 20px; font-size: 13.5px; }
  .persona .pie-edicion button.principal:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  /* Eliminar va aparte, al fondo y con su explicacion: es lo unico que no
     tiene vuelta atras y no debe parecer un boton mas junto a Guardar. */
  .persona .zona-eliminar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--borde-fuerte);
  }
  .persona .zona-eliminar .explica { flex: 1 1 220px; font-size: 12px; color: var(--tinta-2); }
  button.eliminar-usuario {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    color: var(--alto); background: none; border: 1px solid var(--alto); border-radius: 8px;
    padding: 6px 12px;
  }
  button.eliminar-usuario svg { fill: currentColor; }
  button.eliminar-usuario:hover { background: var(--alto); color: #fff; }
  button.eliminar-usuario:focus-visible { outline: 2px solid var(--alto); outline-offset: 2px; }
  .persona.editando .quitar-foto {
    font: inherit; font-size: 11.5px; background: none; border: none; padding: 0;
    color: var(--tinta-2); cursor: pointer; text-decoration: underline;
  }
  button.avatar-boton { background: none; border: none; padding: 0; cursor: pointer; font: inherit; }
  button.avatar-boton:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; border-radius: 8px; }
  .persona.editando .avatar-boton { display: flex; flex-direction: column; align-items: center; gap: 5px; align-self: flex-start; }
  .persona.editando .avatar-boton span { font-size: 11.5px; color: var(--acento-fuerte); }
  .pastilla { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 11px; white-space: nowrap; }
  .pastilla.activo { background: var(--ok-suave); color: var(--acento-fuerte); }
  .pastilla.suspendido { background: var(--aviso-suave); color: var(--aviso); }
  .acciones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .persona.editando {
    background: var(--barra); border-radius: 12px; padding: 16px; margin: 6px 0;
    border-bottom: none; align-items: flex-start;
  }
  .persona input.nombre {
    font: inherit; font-size: 15px; width: 100%;
    border: none; border-bottom: 2px solid var(--acento);
    background: none; color: var(--tinta); padding: 4px 2px;
  }
  .persona input.nombre:focus-visible { outline: none; }
  .persona .pista { color: var(--tinta-2); font-size: 12.5px; margin-top: 3px; }
  /* Que cadenas ve cada quien: en la ficha, y para elegirlas al editar. */
  .acceso { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
  .acceso .rotulo { color: var(--tinta-2); font-size: 12px; margin-right: 2px; }
  .pastilla.cadena { background: none; border: 1px solid var(--borde-fuerte); color: var(--tinta-2); font-weight: 500; }
  .pastilla.cadena.limitada { border-color: var(--acento); color: var(--acento-fuerte); }
  /* Que cadenas puede ver: un interruptor de "todas" y, apagado, una
     casilla por cadena. */
  .acceso-datos { margin-top: 14px; }
  .acceso-datos .titulo-acceso { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  button.interruptor-todas {
    display: flex; align-items: center; gap: 10px; width: 100%;
    font: inherit; font-size: 14px; color: var(--tinta); text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--borde-fuerte); border-radius: 10px;
    padding: 10px 12px;
  }
  button.interruptor-todas .riel {
    flex: none; width: 36px; height: 20px; border-radius: 10px; background: var(--borde-fuerte);
    position: relative; transition: background .15s;
  }
  button.interruptor-todas .riel::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
  }
  button.interruptor-todas[aria-checked="true"] .riel { background: var(--acento-fuerte); }
  button.interruptor-todas[aria-checked="true"] .riel::after { transform: translateX(16px); }
  button.interruptor-todas .detalle { margin-left: auto; font-size: 12px; color: var(--tinta-2); }
  button.interruptor-todas:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .casillas-cadenas {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; margin-top: 8px;
  }
  label.casilla-cadena {
    display: flex; align-items: center; gap: 9px; cursor: pointer; user-select: none;
    background: var(--panel); border: 1px solid var(--borde-fuerte); border-radius: 10px;
    padding: 9px 11px; font-size: 14px; transition: border-color .12s, background .12s;
  }
  label.casilla-cadena input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  label.casilla-cadena .caja {
    flex: none; width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--borde-fuerte);
    display: grid; place-items: center; transition: background .12s, border-color .12s;
  }
  label.casilla-cadena .caja svg { width: 12px; height: 12px; fill: #fff; opacity: 0; }
  label.casilla-cadena:hover { border-color: var(--acento); }
  label.casilla-cadena:has(input:checked) { border-color: var(--acento); background: var(--ok-suave); }
  label.casilla-cadena:has(input:checked) .caja { background: var(--acento-fuerte); border-color: var(--acento-fuerte); }
  label.casilla-cadena:has(input:checked) .caja svg { opacity: 1; }
  label.casilla-cadena:has(input:focus-visible) { outline: 2px solid var(--acento); outline-offset: 2px; }
  .acceso-datos .pista { margin-top: 8px; }
  .acceso-datos .pista.falta { color: var(--alto); }
  button.accion {
    font-size: 12.5px; background: none; color: var(--tinta-2);
    border: 1px solid var(--borde-fuerte); border-radius: 15px;
    padding: 4px 13px 4px 10px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button.accion svg { fill: currentColor; flex: none; }
  button.accion:hover { border-color: var(--aviso); color: var(--aviso); }
  button.accion.peligro:hover { border-color: var(--alto); color: var(--alto); }
  button.accion.buena:hover { border-color: var(--acento); color: var(--acento-fuerte); }
  button.accion:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }

  /* --- actividad --- */
  .trabajo {
    background: var(--panel); border-radius: 8px; padding: 14px 16px;
    box-shadow: var(--sombra); margin-bottom: 12px;
    border-left: 4px solid var(--acento);
  }
  .trabajo .cabeza { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 9px; }
  .trabajo .pregunta { font-weight: 600; flex: 1 1 260px; }
  .trabajo .quien { color: var(--tinta-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .reloj {
    font-size: 12px; color: var(--tinta-2); background: var(--barra);
    border-radius: 12px; padding: 2px 9px; font-variant-numeric: tabular-nums;
  }
  .reloj.largo { background: var(--aviso-suave); color: var(--aviso); }

  /* --- logs --- */
  .logs { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
  .logs-barra {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; flex: none;
    padding: 9px 16px; background: var(--barra); border-bottom: 1px solid var(--borde);
  }
  .logs-barra .filtros { display: flex; gap: 6px; flex-wrap: wrap; }
  .logs-barra button.filtro {
    border: 1px solid var(--borde-fuerte); background: var(--panel); color: var(--tinta-2);
    border-radius: 15px; padding: 4px 12px; font-size: 12.5px; cursor: pointer;
  }
  .logs-barra button.filtro[aria-pressed="true"] {
    background: var(--ok-suave); color: var(--acento-fuerte); border-color: transparent; font-weight: 600;
  }
  .logs-barra button.filtro:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  .logs-barra label.interruptor {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tinta-2); cursor: pointer;
  }
  .logs-barra .contador { margin-left: auto; font-size: 12px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
  .logs-lineas {
    flex: 1; overflow: auto; padding: 8px 0 20px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55; color: var(--tinta);
  }
  .logs-lineas:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
  /* minmax(0, 1fr) y no 1fr: con 1fr la columna crece hasta la palabra mas
     larga (una URL, una ruta de Windows) y en el telefono la linea se sale
     de la pantalla en vez de partirse. */
  .logs-lineas .linea {
    display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; padding: 1px 16px;
    white-space: pre-wrap;
  }
  .logs-lineas .linea .texto { min-width: 0; overflow-wrap: anywhere; }
  .logs-lineas .linea .hora { color: var(--tinta-3); font-variant-numeric: tabular-nums; }
  .logs-lineas .linea.aviso { background: var(--aviso-suave); color: var(--aviso); }
  .logs-lineas .linea.error { background: var(--alto-suave); color: var(--alto); }
  .logs-lineas .linea.aviso .hora, .logs-lineas .linea.error .hora { color: inherit; opacity: .75; }
  .pastilla.errores { background: var(--alto-suave); color: var(--alto); }
  .pastilla.avisos { background: var(--aviso-suave); color: var(--aviso); }
  .pastilla.limpio { background: var(--ok-suave); color: var(--acento-fuerte); }

  .vacio { color: var(--tinta-2); text-align: center; padding: 46px 20px; font-size: 14px; }

  /* --- busqueda en las conversaciones --- */
  mark.hallazgo { background: var(--aviso-suave); color: inherit; border-radius: 3px; padding: 0 1px; }
  .burbuja mark.hallazgo { background: #ffd54f; color: #111b21; }
  .seccion-busqueda {
    padding: 10px 16px 4px; font-size: 12px; font-weight: 600; color: var(--tinta-2);
    text-transform: uppercase; letter-spacing: .03em;
  }
  .buscando { padding: 10px 16px; font-size: 13px; color: var(--tinta-2); }

  /* --- calificaciones --- */
  .leyenda-calif {
    padding: 8px 14px; font-size: 12px; line-height: 1.5; color: var(--tinta-2);
    border-bottom: 1px solid var(--borde);
  }
  .leyenda-calif .emojis { display: block; font-size: 16px; letter-spacing: 1px; margin-top: 2px; }
  .filtros-calif { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--borde); }
  .filtros-calif button {
    border: 1px solid var(--borde-fuerte); background: var(--panel); color: var(--tinta-2);
    border-radius: 15px; padding: 4px 12px; font-size: 12.5px; cursor: pointer;
  }
  .filtros-calif button[aria-pressed="true"] {
    background: var(--ok-suave); color: var(--acento-fuerte); border-color: transparent; font-weight: 600;
  }
  .filtros-calif button:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  .avatar.calif { font-size: 22px; background: var(--barra); }
  .ir-al-chat {
    display: block; margin: 14px auto 4px; border: 1px solid var(--borde-fuerte); background: var(--panel);
    color: var(--acento-fuerte); border-radius: 16px; padding: 6px 16px; font-size: 13px; cursor: pointer;
  }
  .bienvenida {
    flex: 1; display: grid; place-content: center; justify-items: center;
    gap: 14px; text-align: center; padding: 30px; background: var(--panel);
    border-bottom: 5px solid var(--acento);
  }
  .bienvenida h2 { font-weight: 300; font-size: 31px; margin: 0; color: var(--tinta-2); }
  .bienvenida p { color: var(--tinta-3); font-size: 14px; margin: 0; max-width: 48ch; }

  .aviso-error {
    background: var(--alto-suave); color: var(--alto);
    padding: 10px 16px; font-size: 13.5px; font-weight: 500; flex: none;
  }
  .volver { display: none; background: none; border: none; cursor: pointer; padding: 4px; }
  .volver svg { fill: var(--tinta-2); display: block; }

  [hidden] { display: none !important; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .lateral, .principal { grid-column: 1; grid-row: 1; }
    .app.viendo-chat .lateral { display: none; }
    .app:not(.viendo-chat) .principal { display: none; }
    .volver { display: block; }
    .doodle { padding-inline: 14px; }
    .burbuja { max-width: 88%; }
    .logs-barra { padding-inline: 12px; }
    .logs-lineas { font-size: 12px; }
    .logs-lineas .linea { grid-template-columns: 58px minmax(0, 1fr); gap: 8px; padding-inline: 12px; }
    /* En el telefono los botones bajan a su propia linea: al lado se
       comian el ancho y el nombre y las cadenas quedaban en una columna. */
    .persona { flex-wrap: wrap; }
    .persona .datos { flex-basis: calc(100% - 60px); }
    .persona .acciones { width: 100%; }
    .resumen-usuarios { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    /* Editando, la foto va arriba: al lado le quitaba a la ficha el ancho
       que necesitan las casillas. */
    .persona.editando { flex-direction: column; align-items: stretch; }
    .persona.editando .datos { flex-basis: auto; }
    .persona.editando .avatar-boton { flex-direction: row; align-self: flex-start; }
    .casillas-cadenas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    button.interruptor-todas .detalle { display: none; }
    button.cifra { padding: 9px 12px; }
    button.cifra .numero { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="lateral">
    <div class="barra">
      <div class="marca">
        <div class="avatar marca" aria-hidden="true">
          <svg width="27" height="27" viewBox="0 0 200 200">
            <path d="M62 148 L58 186 L104 156 Z" fill="#fff"/>
            <circle cx="100" cy="92" r="72" fill="#fff"/>
            <circle cx="68" cy="92" r="11" fill="#00B1FF"/>
            <circle cx="100" cy="92" r="11" fill="#00B1FF"/>
            <circle cx="132" cy="92" r="11" fill="#00B1FF"/>
          </svg>
        </div>
        <div style="min-width:0">
          <div class="nombre" data-t="marca">Panel del bot</div>
          <div class="lugar">GTM Honor México</div>
        </div>
      </div>
      <div class="ajustes">
        <button type="button" id="boton-tema" title="Cambiar a modo oscuro"></button>
        <button type="button" id="boton-idioma" class="lengua" title="Switch to English"></button>
      </div>
    </div>

    <div class="herramientas">
      <div class="buscador">
        <svg width="17" height="17" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
        <input id="buscar" type="search" placeholder="Buscar nombre, número o palabras" aria-label="Buscar" data-t-ph="buscar_chats">
      </div>
      <div class="solapas" role="tablist">
        <button role="tab" id="tab-chats" aria-selected="true" aria-controls="lista">
          <span class="icono" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 5.9L4 21l4.2-2.1c1.2.4 2.5.6 3.8.6 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg><span class="cuenta" id="cuenta-chats"></span></span>
          <span class="etiqueta" data-t="tab_chats">Chats</span>
        </button>
        <button role="tab" id="tab-usuarios" aria-selected="false" aria-controls="lista">
          <span class="icono" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/></svg><span class="cuenta aviso" id="cuenta-usuarios"></span></span>
          <span class="etiqueta" data-t="tab_usuarios">Usuarios</span>
        </button>
        <button role="tab" id="tab-calificaciones" aria-selected="false" aria-controls="lista">
          <span class="icono" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 20h3V10H2v10zm20-9c0-1.1-.9-2-2-2h-5.6l.9-4.3v-.3c0-.4-.2-.8-.4-1.1L13.8 2 7.6 8.2c-.4.4-.6.8-.6 1.4V18c0 1.1.9 2 2 2h8.2c.8 0 1.5-.5 1.8-1.2l2.9-6.8c.1-.2.1-.5.1-.7V11z"/></svg><span class="cuenta aviso" id="cuenta-calificaciones"></span></span>
          <span class="etiqueta" data-t="tab_calificaciones">Calificaciones</span>
        </button>
        <button role="tab" id="tab-logs" aria-selected="false" aria-controls="lista">
          <span class="icono" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v12h14V6H5zm2 2.5 3.5 3.5L7 15.5l-1.4-1.4L7.7 12 5.6 9.9 7 8.5zM12 14h6v1.8h-6V14z"/></svg><span class="cuenta alto" id="cuenta-logs"></span></span>
          <span class="etiqueta" data-t="tab_logs">Logs</span>
        </button>
      </div>
    </div>

    <div class="lista" id="lista"></div>
  </aside>

  <main class="principal" id="principal">
    <div class="barra">
      <button class="volver" id="volver" type="button" data-t-aria="volver">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </button>
      <div class="avatar chico" id="avatar-principal" aria-hidden="true" hidden></div>
      <div style="min-width:0">
        <div class="nombre" id="titulo-principal" data-t="marca">Panel del bot</div>
        <div class="lugar" id="subtitulo-principal" data-t="elige">Elige una conversación</div>
      </div>
      <div class="pulso">
        <span class="foco" id="foco"></span>
        <span id="texto-estado" data-t="conectando">conectando…</span>
      </div>
    </div>

    <div id="error" class="aviso-error" hidden></div>

    <div class="bienvenida" id="vista-bienvenida">
      <h2 data-t="marca">Panel del bot</h2>
      <p data-t="bienvenida"></p>
      <p id="resumen-bienvenida" class="lugar"></p>
    </div>

    <div class="doodle" id="vista-chat" hidden></div>
    <div class="pie-panel" id="pie-chat" hidden>
      <span data-t="solo_lectura">Solo lectura: desde aquí no se le escribe al usuario.</span>
    </div>

    <div class="doodle" id="vista-actividad" hidden></div>

    <div class="hoja" id="vista-usuarios" hidden>
      <div class="hoja-interior">
        <div class="resumen-usuarios" id="resumen-usuarios" role="group"></div>

        <div class="cabeza-lista">
          <h2 data-t="quien_puede">Quién puede usar el bot</h2>
          <span class="cuenta" id="cuenta-personas"></span>
        </div>

// bloqueados. Recordar la preferencia es una comodidad, no puede tumbar el
// panel, asi que las dos puntas van envueltas.
function recordar(clave, valor) {
  try {
    window.localStorage.setItem(`${GUARDADO}:${clave}`, valor);
  } catch (error) {
    /* sin memoria entre visitas; todo lo demas sigue igual */
  }
}

function recordado(clave) {
  try {
    return window.localStorage.getItem(`${GUARDADO}:${clave}`);
  } catch (error) {
    return null;
  }
}

function elemento(etiqueta, clase, contenido) {
  const nodo = document.createElement(etiqueta);
  if (clase) nodo.className = clase;
  if (contenido !== undefined) nodo.textContent = contenido;
  return nodo;
}

async function pedir(ruta, opciones) {
  const respuesta = await fetch(ruta, opciones);
  const cuerpo = await respuesta.json().catch(() => ({}));
  if (!respuesta.ok) throw new Error(cuerpo.detail || `Error ${respuesta.status}`);
  return cuerpo;
}

function mostrarError(mensaje) {
  const caja = $("error");
  if (!mensaje) { caja.hidden = true; return; }
  caja.textContent = mensaje;
  caja.hidden = false;
}

const soloNumero = (chatId) => String(chatId || "").split("@")[0];

function iniciales(numero) {
  const limpio = soloNumero(numero);
  return limpio.length >= 4 ? limpio.slice(-4) : limpio || "··";
}

const fecha = (iso) => {
  const t = new Date(iso);
  return isNaN(t) ? null : t;
};
function horaCorta(iso) {
  const t = fecha(iso);
  return t ? t.toLocaleTimeString(localeDeFecha(), { hour: "2-digit", minute: "2-digit" }) : "";
}
function diaLargo(iso) {
  const t = fecha(iso);
  if (!t) return "";
  const hoy = new Date();
  const ayer = new Date(hoy);
  ayer.setDate(hoy.getDate() - 1);
  const mismoDia = (a, b) => a.toDateString() === b.toDateString();
  if (mismoDia(t, hoy)) return t2("hoy");
  if (mismoDia(t, ayer)) return t2("ayer");
  return t.toLocaleDateString(localeDeFecha(), { day: "numeric", month: "long", year: "numeric" });
}
function cuandoEnLista(iso) {
  const t = fecha(iso);
  if (!t) return "";
  return t.toDateString() === new Date().toDateString()
    ? horaCorta(iso)
    : t.toLocaleDateString(localeDeFecha(), { day: "2-digit", month: "2-digit", year: "2-digit" });
}
function duracion(segundos) {
  const s = Math.max(0, Math.round(Number(segundos) || 0));
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;
}

function palomas(rojas) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 18 12");
  svg.setAttribute("width", "17");
  svg.setAttribute("height", "11");
  svg.setAttribute("class", `palomas${rojas ? " rojas" : ""}`);
  const trazo = document.createElementNS(NS, "path");
  trazo.setAttribute(
    "d",
    "M6.6 11.1 1 5.6l1.3-1.3 4.3 4.2L15 0l1.3 1.3zM11.9 1.3 10.6 0 5.3 8.5l1.1 1.1z",
  );
  svg.append(trazo);
  return svg;
}

function avatar(numero, clase = "", foto = "") {
  const nodo = elemento("div", `avatar ${clase}`.trim());
  if (foto) {
    const imagen = document.createElement("img");
    imagen.src = `/panel/foto/${encodeURIComponent(foto)}`;
    imagen.alt = "";
    // Si la foto se borro del disco a mano, quedan las iniciales en vez de
    // un hueco con el icono de imagen rota.
    imagen.addEventListener("error", () => {
      nodo.replaceChildren(document.createTextNode(iniciales(numero)));
    });
    nodo.append(imagen);
  } else {
    nodo.textContent = iniciales(numero);
  }
  return nodo;
}

// Lo que se sabe de un numero: sirve para que la conversacion muestre el
// nombre y la foto de quien escribe, y no solo su numero.
function fichaDe(chatId) {
  const numero = soloNumero(chatId);
  return cacheUsuarios.find((u) => u.numero === numero) || null;
}

/* ----------------------------------------------------------- lista lateral */

function pintarLista() {
  const caja = $("lista");
  caja.replaceChildren();
  if (solapa === "usuarios") pintarListaUsuarios(caja);
  else if (solapa === "logs") pintarListaDias(caja);
  else if (solapa === "calificaciones") pintarListaCalif(caja);
  else pintarListaChats(caja);
}

function pintarListaChats(caja) {
  // Lo que esta corriendo va fijado arriba, como un chat anclado.
  if (enCursoPorChat.size > 0) {
    const fijado = elemento("button", "renglon fijado");
    fijado.type = "button";
    const centro = elemento("div", "centro");
    const arriba = elemento("div", "arriba");
    arriba.append(elemento("span", "titulo", t("ahora_mismo")));
    const abajo = elemento("div", "abajo");
    abajo.append(
      elemento(
        "span",
        "vista-previa escribiendo",
        t("corriendo", enCursoPorChat.size),
      ),
    );
    centro.append(arriba, abajo);
    const ico = elemento("div", "avatar acento", String(enCursoPorChat.size));
    fijado.append(ico, centro);
    if (vista === "actividad") fijado.setAttribute("aria-current", "true");
    fijado.addEventListener("click", abrirActividad);
    caja.append(fijado);
  }

  if (busqueda) {
    pintarResultadosDeBusqueda(caja);
    return;
  }

  const visibles = cacheChats;
  if (!visibles.length) {
    caja.append(elemento("div", "vacio", t("sin_conversaciones")));
    return;
  }

  for (const chat of visibles) {
    const corriendo = enCursoPorChat.has(chat.chat_id);
    const fila = elemento("button", "renglon");
    fila.type = "button";
    if (chat.chat_id === chatElegido && vista === "chat") fila.setAttribute("aria-current", "true");

    const ficha = fichaDe(chat.chat_id);
    const centro = elemento("div", "centro");
    const arriba = elemento("div", "arriba");
    arriba.append(
      elemento("span", "titulo", ficha?.nombre || soloNumero(chat.chat_id)),
      elemento("span", "hora", cuandoEnLista(chat.ultimo)),
    );
    const abajo = elemento("div", "abajo");
    abajo.append(
      corriendo
        ? elemento("span", "vista-previa escribiendo", t("consultando"))
        : elemento("span", "vista-previa", chat.ultima_pregunta),
      elemento("span", "globo", String(chat.turnos)),
    );
    centro.append(arriba, abajo);
    fila.append(avatar(chat.chat_id, "", ficha?.foto), centro);
    fila.addEventListener("click", () => abrirChat(chat.chat_id).catch((e) => mostrarError(e.message)));
    caja.append(fila);
  }
}

// Minusculas y sin acentos, letra por letra: mide lo mismo que el original,
// asi que una posicion en uno vale en el otro (para resaltar).
function sinAcentos(texto) {
  let plano = "";
  for (const letra of String(texto ?? "")) {
    const base = letra.normalize("NFD")[0] || letra;
    plano += base.length === letra.length ? base.toLowerCase() : letra.toLowerCase();
  }
  return plano;
}

// El texto con cada aparicion de `buscado` envuelta en <mark>, nodo por nodo.
function conHallazgos(texto, buscado) {
  const trozo = document.createDocumentFragment();
  const original = String(texto ?? "");
  const plano = sinAcentos(original);
  const aguja = sinAcentos(buscado);
  let desde = 0;
  let donde = aguja ? plano.indexOf(aguja) : -1;
  while (donde >= 0) {
    if (donde > desde) trozo.append(document.createTextNode(original.slice(desde, donde)));
    trozo.append(elemento("mark", "hallazgo", original.slice(donde, donde + aguja.length)));
    desde = donde + aguja.length;
    donde = plano.indexOf(aguja, desde);
  }
  if (desde < original.length) trozo.append(document.createTextNode(original.slice(desde)));
  return trozo;
}

function filaDeChat(chat, { fragmento, coincidencias, cuando } = {}) {
  const fila = elemento("button", "renglon");
  fila.type = "button";
  if (chat.chat_id === chatElegido && vista === "chat") fila.setAttribute("aria-current", "true");
  const ficha = fichaDe(chat.chat_id);
  const titulo = elemento("span", "titulo");
  titulo.append(conHallazgos(ficha?.nombre || soloNumero(chat.chat_id), busqueda));
  const arriba = elemento("div", "arriba");
  arriba.append(titulo, elemento("span", "hora", cuandoEnLista(cuando || chat.ultimo)));
  const previa = elemento("span", "vista-previa");
  // Sin los ** de las negritas: en una linea de vista previa estorban.
  previa.append(conHallazgos(String(fragmento ?? chat.ultima_pregunta ?? "").replaceAll("**", ""), busqueda));
  const abajo = elemento("div", "abajo");
  abajo.append(previa, elemento("span", "globo", String(coincidencias ?? chat.turnos ?? "")));
  const centro = elemento("div", "centro");
  centro.append(arriba, abajo);
  fila.append(avatar(chat.chat_id, "", ficha?.foto), centro);
  fila.addEventListener("click", () => {
    resaltar = fragmento ? busqueda : "";
    abrirChat(chat.chat_id).catch((e) => mostrarError(e.message));
  });
  return fila;
}

function pintarResultadosDeBusqueda(caja) {
  const plano = sinAcentos(busqueda);
  const digitos = busqueda.replace(/\D/g, "");
  const soloDigitos = digitos && digitos === busqueda.replace(/[\s+()-]/g, "");
  const porTexto = new Map((resultadosTexto || []).map((r) => [r.chat_id, r]));

  // Primero por nombre guardado o por numero; si ademas lo dijo, con el pedazo.
  const porNombre = cacheChats.filter((c) => {
    const nombre = sinAcentos(fichaDe(c.chat_id)?.nombre || "");
    return (nombre && nombre.includes(plano)) || (soloDigitos && soloNumero(c.chat_id).includes(digitos));
  });
  const yaListados = new Set(porNombre.map((c) => c.chat_id));
  if (porNombre.length) {
    caja.append(elemento("div", "seccion-busqueda", t("por_nombre")));
    for (const chat of porNombre) {
      const hallazgo = porTexto.get(chat.chat_id);
      caja.append(filaDeChat(chat, hallazgo ? {
        fragmento: hallazgo.fragmento, coincidencias: hallazgo.coincidencias, cuando: hallazgo.ultimo,
      } : {}));
    }
  }

  const soloTexto = (resultadosTexto || []).filter((r) => !yaListados.has(r.chat_id));
  if (soloTexto.length) {
    caja.append(elemento("div", "seccion-busqueda", t("en_conversaciones")));
    for (const hallazgo of soloTexto) {
      const chat = cacheChats.find((c) => c.chat_id === hallazgo.chat_id) || { chat_id: hallazgo.chat_id };
      caja.append(filaDeChat(chat, {
        fragmento: hallazgo.fragmento, coincidencias: hallazgo.coincidencias, cuando: hallazgo.ultimo,
      }));
    }
  }

  if (resultadosTexto === null && busqueda.length >= 2) {
    caja.append(elemento("div", "buscando", t("buscando")));
  } else if (!porNombre.length && !soloTexto.length) {
    caja.append(elemento("div", "vacio", t("nada_coincide", busqueda)));
  }
}

// En el chat abierto desde la busqueda: resalta lo buscado y lleva al primero.
function resaltarEnChat(caja) {
  if (!resaltar) return;
  for (const texto of caja.querySelectorAll(".texto-burbuja")) {
    if (!sinAcentos(texto.textContent).includes(sinAcentos(resaltar))) continue;
    for (const nodo of [...texto.childNodes]) {
      if (nodo.nodeType === Node.TEXT_NODE) {
        nodo.replaceWith(conHallazgos(nodo.textContent, resaltar));
      } else if (nodo.nodeName === "STRONG") {
        const contenido = nodo.textContent;
        nodo.replaceChildren(conHallazgos(contenido, resaltar));
      }
    }
  }
  const marcas = caja.querySelectorAll("mark.hallazgo");
  if (marcas.length) marcas[marcas.length - 1].scrollIntoView({ block: "center" });
}

async function buscarEnConversaciones(texto) {
  try {
    const datos = await pedir(`/panel/buscar?texto=${encodeURIComponent(texto)}`);
    if (texto !== busqueda) return;  // ya escribieron otra cosa
    resultadosTexto = datos.chats;
  } catch (error) {
    if (texto !== busqueda) return;
    resultadosTexto = [];
    mostrarError(error.message);
  }
  if (solapa === "chats") pintarLista();
}

function pintarListaUsuarios(caja) {
  const visibles = cacheUsuarios.filter((u) => u.numero.includes(filtro));
  if (!visibles.length) {
    caja.append(
      elemento("div", "vacio", filtro ? t("sin_coincidencias") : t("sin_usuarios")),
    );
    return;
  }
  for (const usuario of visibles) {
    const fila = elemento("button", "renglon");
    fila.type = "button";
    const centro = elemento("div", "centro");
    const arriba = elemento("div", "arriba");
    arriba.append(elemento("span", "titulo", quienEs(usuario)));
    const abajo = elemento("div", "abajo");
    // Sin nombre, el numero ya es el titulo: repetirlo o poner "sin nombre"
    // no dice nada. Se muestra cuando entro a la lista.
    abajo.append(
      elemento(
        "span",
        "vista-previa",
        usuario.nombre ? numeroLegible(usuario.numero) : t("alta", fechaCorta(usuario.creado)),
      ),
      elemento("span", `pastilla ${usuario.estado}`, t("estado")[usuario.estado] || usuario.estado),
    );
    centro.append(arriba, abajo);
    fila.append(avatar(usuario.numero, "", usuario.foto), centro);
    fila.addEventListener("click", abrirUsuarios);
    caja.append(fila);
  }
}

/* ------------------------------------------------------ panel de la derecha */

function mostrarVista(cual) {
  vista = cual;
  $("vista-bienvenida").hidden = cual !== "bienvenida";
  $("vista-chat").hidden = cual !== "chat";
  $("pie-chat").hidden = cual !== "chat";
  $("vista-actividad").hidden = cual !== "actividad";
  $("vista-usuarios").hidden = cual !== "usuarios";
  $("vista-logs").hidden = cual !== "logs";
  $("vista-calificacion").hidden = cual !== "calificacion";
  $("app").classList.toggle("viendo-chat", cual !== "bienvenida");
}

function encabezado(titulo, subtitulo, numeroParaAvatar) {
  $("titulo-principal").textContent = titulo;
  $("subtitulo-principal").textContent = subtitulo;
  const hueco = $("avatar-principal");
  hueco.hidden = !numeroParaAvatar;
  hueco.replaceChildren();
  if (numeroParaAvatar) {
    const ficha = fichaDe(numeroParaAvatar);
    hueco.append(avatar(numeroParaAvatar, "chico", ficha?.foto));
  }
}

async function abrirChat(chatId) {
  chatElegido = chatId;
  mostrarVista("chat");
  location.hash = `chat=${soloNumero(chatId)}`;
  const ficha = fichaDe(chatId);
  encabezado(
    ficha?.nombre || soloNumero(chatId),
    enCursoPorChat.has(chatId) ? t("consultando") : soloNumero(chatId),
    chatId,
  );
  pintarLista();

  const datos = await pedir(
    `/panel/conversaciones?chat_id=${encodeURIComponent(chatId)}&limite=${POR_PAGINA}`,
  );
  const caja = $("vista-chat");
  caja.replaceChildren();
  turnosCargados = datos.turnos.length;
  quedanAnteriores = Boolean(datos.hay_mas);

  if (!turnosCargados) {
    caja.append(elemento("div", "vacio", t("sin_turnos")));
    return;
  }

  encabezado(
    ficha?.nombre || soloNumero(chatId),
    `${soloNumero(chatId)} · ${t("turnos", datos.total)}`,
    chatId,
  );
  pintarTurnos(caja, datos.turnos, null);
  pintarBotonDeAnteriores(caja);
  caja.scrollTop = caja.scrollHeight;
  resaltarEnChat(caja);
}

// Del mas viejo al mas nuevo, como se lee una conversacion. Devuelve el dia
// del primer turno pintado, para no repetir el separador al cargar mas.
function pintarTurnos(caja, turnos, antesDe) {
  const trozo = document.createDocumentFragment();
  let diaAnterior = null;
  for (const turno of [...turnos].reverse()) {
    const dia = diaLargo(turno.inicio);
    if (dia !== diaAnterior) {
      trozo.append(elemento("span", "dia", dia));
      diaAnterior = dia;
    }
    trozo.append(burbujaDeTurno(turno));
  }
  if (antesDe) caja.insertBefore(trozo, antesDe);
  else caja.append(trozo);
}

function pintarBotonDeAnteriores(caja) {
  const viejo = caja.querySelector(".anteriores");
  if (viejo) viejo.remove();
  if (!quedanAnteriores) return;

  const boton = elemento("button", "anteriores", t("ver_anteriores"));
  boton.type = "button";
  boton.addEventListener("click", () => cargarAnteriores(boton));
  caja.prepend(boton);
}

async function cargarAnteriores(boton) {
  const caja = $("vista-chat");
  boton.disabled = true;
  boton.textContent = t("cargando");
  try {
    const datos = await pedir(
      `/panel/conversaciones?chat_id=${encodeURIComponent(chatElegido)}` +
        `&limite=${POR_PAGINA}&salto=${turnosCargados}`,
    );
    turnosCargados += datos.turnos.length;
    quedanAnteriores = Boolean(datos.hay_mas);

    // Los nuevos entran ARRIBA, asi que la pagina crece hacia atras y lo que
    // el usuario estaba mirando se le iria de la pantalla. Se compensa el
    // scroll con lo que crecio.
    const altoAntes = caja.scrollHeight;
    const arribaAntes = caja.scrollTop;
    pintarTurnos(caja, datos.turnos, caja.firstChild);
    caja.scrollTop = arribaAntes + (caja.scrollHeight - altoAntes);

    pintarBotonDeAnteriores(caja);
  } catch (error) {
    mostrarError(error.message);
    boton.disabled = false;
    boton.textContent = t("ver_anteriores");
  }
}

// El texto de la respuesta con sus **negritas**, como se ve en WhatsApp (ahi
// el sidecar las convierte; aqui salian con los asteriscos). Se arma nodo por
// nodo y nunca con innerHTML: la respuesta la escribio un modelo y no debe
// poder meter HTML en el panel.
function conNegritas(texto) {
  const trozo = document.createDocumentFragment();
  const partes = String(texto).split(/\*\*(.+?)\*\*/gs);
  partes.forEach((parte, i) => {
    if (!parte) return;
    trozo.append(i % 2 ? elemento("strong", null, parte) : document.createTextNode(parte));
  });
  return trozo;
}

function botonDeTraduccion(turno, textoPregunta, textoRespuesta) {
  const boton = elemento("button", "traducir", t("traducir"));
  boton.type = "button";
  const lengua = t("lenguas")[turno.idioma] || turno.idioma;
  let traducido = null;
  let mostrandoTraduccion = false;
  const pintar = (preguntaTexto, respuestaTexto, etiqueta) => {
    textoPregunta.replaceChildren();
    textoRespuesta.replaceChildren();
    if (etiqueta) {
      textoPregunta.append(elemento("span", "traducido", etiqueta));
      textoRespuesta.append(elemento("span", "traducido", etiqueta));
    }
    textoPregunta.append(document.createTextNode(preguntaTexto));
    textoRespuesta.append(conNegritas(respuestaTexto));
  };
  const original = [turno.pregunta || "", turno.respuesta || ""];
  boton.addEventListener("click", async () => {
    if (mostrandoTraduccion) {
      pintar(original[0], original[1], null);
      boton.textContent = t("traducir");
      mostrandoTraduccion = false;
      return;
    }
    if (!traducido) {
      boton.disabled = true;
      boton.textContent = t("traduciendo");
      try {
        const datos = await pedir("/panel/traducir", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ textos: original, destino: idioma }),
        });
        traducido = datos.traducciones;
      } catch (error) {
        boton.disabled = false;
        boton.textContent = t("traducir");
        mostrarError(t("no_se_tradujo"));
        return;
      }
      boton.disabled = false;
    }
    pintar(traducido[0] || original[0], traducido[1] || original[1], t("traducido_de", lengua));
    boton.textContent = t("ver_original", lengua);
    mostrandoTraduccion = true;
  });
  return boton;
}

function burbujaDeTurno(turno) {
  const grupo = elemento("div", "turno");

  const pregunta = elemento("div", "burbuja entra");
  const textoPregunta = elemento("span", "texto-burbuja");
  textoPregunta.append(document.createTextNode(turno.pregunta));
  pregunta.append(textoPregunta);
  const pie = elemento("div", "pie-burbuja");
  pie.append(elemento("span", null, horaCorta(turno.inicio)));
  pregunta.append(pie);
  grupo.append(pregunta);

  const fallo = turno.estado !== "listo";
  const respuesta = elemento("div", `burbuja sale${fallo ? " fallo" : ""}`);
  respuesta.style.marginTop = "7px";
  const textoRespuesta = elemento("span", "texto-burbuja");
  textoRespuesta.append(
    conNegritas(
      turno.respuesta ||
        (turno.estado === "cancelado" ? t("cancelada") : t("sin_respuesta")),
    ),
  );
  respuesta.append(textoRespuesta);

  const pieBot = elemento("div", "pie-burbuja");
  if (turno.calificacion) {
    const mala = Number(turno.calificacion.valor) < 0;
    const globo = elemento("span", `reaccion${mala ? " mala" : ""}`, turno.calificacion.emoji);
    globo.title = t("calificada", turno.calificacion.emoji, diaLargo(turno.calificacion.fecha));
    respuesta.classList.add("con-reaccion");
    respuesta.append(globo);
  }
  if (turno.archivos.length) pieBot.append(elemento("span", null, `📎 ${turno.archivos.length}`));
  if (turno.idioma) pieBot.append(elemento("span", null, turno.idioma));
  pieBot.append(elemento("span", null, duracion(turno.segundos)));
  pieBot.append(elemento("span", null, horaCorta(turno.inicio)));
  pieBot.append(palomas(fallo));
  respuesta.append(pieBot);
  grupo.append(respuesta);

  // Un turno en otro idioma (el bot contesta en el de quien pregunta) se
  // puede traducir al del panel, solo para revisarlo: lo que recibio el
  // usuario no cambia.
  if (turno.idioma && turno.idioma !== idioma && (turno.pregunta || turno.respuesta)) {
    grupo.append(botonDeTraduccion(turno, textoPregunta, textoRespuesta));
  }

  if (turno.pasos.length) {
    const detalle = elemento("details", "tramoya");
    detalle.append(elemento("summary", null, t("que_hizo", turno.pasos.length)));
    detalle.append(listaDePasos(turno.pasos));
    grupo.append(detalle);
  }
  return grupo;
}

// La marca de cada tipo de paso, dibujada como el resto de los iconos del
// panel: un emoji a 12 px se ve como una mancha de color, y ademas no toma
// el color del tipo.
const MARCAS = {
  // Pensamiento: una burbuja con sus puntos, la misma idea que el logo.
  pensamiento: `<path d="M12 3.5a7.5 6.5 0 1 0-6.2 6.4L5 14l4.2-2.2A7.5 6.5 0 0 0 12 3.5z"
                       fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="8.6" cy="9.4" r="1"/><circle cx="12" cy="9.4" r="1"/><circle cx="15.4" cy="9.4" r="1"/>`,
  // Herramienta: una llave de tuercas, simplificada a una barra con cabeza.
  herramienta: `<path d="M15.6 3.6a4 4 0 0 0-5.1 5.1l-6 6a1.6 1.6 0 1 0 2.3 2.3l6-6a4 4 0 0 0 5.1-5.1l-2.4 2.4-1.9-.5-.5-1.9z"
                       fill="currentColor"/>`,
  // Resultado: la flecha que baja y entra.

                     fill="none" stroke="currentColor" stroke-width="1.8"

function marcaDePaso(tipo) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "13");
  svg.setAttribute("height", "13");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = MARCAS[tipo] || MARCAS.nota;
  return svg;
}

function listaDePasos(pasos) {
  const lista = elemento("ul", "pasos");
  for (const paso of pasos) {
    // Las bitacoras de antes guardaban cada paso como un texto suelto; se
    // siguen leyendo, en un solo renglon.
    if (typeof paso === "string") {
      lista.append(elemento("li", "plano", paso));
      continue;
    }
    const renglon = elemento("li", paso.tipo || "nota");
    const marca = elemento("span", "marca-paso");
    marca.append(marcaDePaso(paso.tipo));
    renglon.append(
      elemento("span", "hora", paso.hora || ""),
      marca,
      elemento("span", "texto", paso.texto || ""),
    );
    lista.append(renglon);
  }
  return lista;
}

function abrirActividad() {

/* ----------------------------------------------------------------- usuarios */

function abrirUsuarios() {
  mostrarVista("usuarios");
  location.hash = "usuarios";
  encabezado(t("tab_usuarios"), t("usuarios_sub"), null);
  pintarPersonas();
}

// El numero del usuario que se esta editando, o null.
let editando = null;
// Que grupo muestra la lista: todos, activo, suspendido o limitado. Lo
// cambian las cifras de arriba.
let grupoDePersonas = "todos";
// Las cadenas elegidas en el formulario de alta. Vacio = todas.
const cadenasDeAlta = new Set();
let accesoDeAlta = null;

// 5215564532268 -> +52 1 55 6453 2268. Solo da formato a los de Mexico,
// que son todos los de hoy; cualquier otro se muestra con su + y nada mas.
function numeroLegible(numero) {
  const n = soloNumero(numero);
  const m = n.match(/^52(1?)(\d{2})(\d{4})(\d{4})$/);
  if (!m) return n ? `+${n}` : "";
  return `+52 ${m[1] ? "1 " : ""}${m[2]} ${m[3]} ${m[4]}`;
}

function fechaCorta(iso) {
  const f = fecha(iso);
  return f ? f.toLocaleDateString(localeDeFecha(), { day: "numeric", month: "short", year: "numeric" }) : "";
}

// Cuando escribio por ultima vez, de la lista de conversaciones.
function ultimoMensajeDe(numero) {
  const chat = cacheChats.find((c) => soloNumero(c.chat_id) === numero);
  return chat?.ultimo || null;
}

function quienEs(usuario) {
  return usuario.nombre || numeroLegible(usuario.numero);
}

function enGrupo(usuario, grupo) {
  if (grupo === "activo" || grupo === "suspendido") return usuario.estado === grupo;
  if (grupo === "limitado") return (usuario.cadenas || []).length > 0;
  return true;
}

function pintarPersonas() {
  pintarCifras();
  const caja = $("personas");
  caja.replaceChildren();
  const alta = $("alta-cadenas");
  accesoDeAlta = checklistDeCadenas(cadenasDeAlta);
  alta.replaceChildren(accesoDeAlta);

  // Activos primero y, dentro, por nombre: es el orden en que se buscan.
  const ordenados = [...cacheUsuarios].sort((a, b) =>
    (a.estado === "activo" ? 0 : 1) - (b.estado === "activo" ? 0 : 1)
    || quienEs(a).localeCompare(quienEs(b), localeDeFecha()));
  const visibles = ordenados.filter((u) => enGrupo(u, grupoDePersonas));
  $("cuenta-personas").textContent = t("cuenta_filtro", visibles.length, cacheUsuarios.length);
  if (!cacheUsuarios.length) {
    caja.append(elemento("div", "vacio", t("sin_usuarios")));
    return;
  }
  if (!visibles.length) {
    caja.append(elemento("div", "vacio", t("nadie_en_filtro")));
    return;
  }
  for (const usuario of visibles) {
    caja.append(usuario.numero === editando ? fichaEditable(usuario) : fichaDeUsuario(usuario));
  }
}

function pintarCifras() {
  const caja = $("resumen-usuarios");
  caja.replaceChildren();
  const cifras = [
    ["todos", "cifra_todos", cacheUsuarios.length],
    ["activo", "cifra_activos", cacheUsuarios.filter((u) => enGrupo(u, "activo")).length],
    ["suspendido", "cifra_suspendidos", cacheUsuarios.filter((u) => enGrupo(u, "suspendido")).length],
    ["limitado", "cifra_limitados", cacheUsuarios.filter((u) => enGrupo(u, "limitado")).length],
  ];
  for (const [grupo, clave, n] of cifras) {
    const b = elemento("button", `cifra ${grupo === "suspendido" && n ? "suspendidos" : ""}`.trim());
    b.type = "button";
    b.setAttribute("aria-pressed", String(grupoDePersonas === grupo));
    b.append(elemento("span", "numero", String(n)), elemento("span", "que", t(clave)));
    b.addEventListener("click", () => {
      // Volver a tocar el grupo elegido regresa a todos.
      grupoDePersonas = grupoDePersonas === grupo ? "todos" : grupo;
      pintarPersonas();
    });
    caja.append(b);
  }
}

function fichaEditable(usuario) {
  const fila = elemento("div", "persona editando");

  const columnaFoto = elemento("div", "avatar-boton");
  const retrato = elemento("button", "avatar-boton");
  retrato.type = "button";
  retrato.title = t("cambiar_foto");
  retrato.setAttribute("aria-label", t("cambiar_foto"));
  retrato.append(avatar(usuario.numero, "", usuario.foto), elemento("span", null, t("foto")));
  retrato.addEventListener("click", () => elegirFoto(usuario));
  columnaFoto.append(retrato);
  if (usuario.foto) {
    const quitar = elemento("button", "quitar-foto", t("quitar_foto"));
    quitar.type = "button";
    quitar.addEventListener("click", () => cambiar("quitar-foto", { numero: usuario.numero }));
    columnaFoto.append(quitar);
  }

  const datos = elemento("div", "datos");
  // Vacio = todas, igual que en el servicio.
  const elegidas = new Set(usuario.cadenas || []);
  const cerrar = () => { editando = null; pintarPersonas(); };

  const rotulo = elemento("label", "rotulo-campo", t("rotulo_nombre"));
  rotulo.htmlFor = `nombre-${usuario.numero}`;
  const campo = document.createElement("input");
  campo.className = "nombre";
  campo.id = `nombre-${usuario.numero}`;
  campo.value = usuario.nombre || "";
  campo.placeholder = t("ph_nombre");

  const guardarBoton = elemento("button", "principal", t("guardar_cambios"));
  guardarBoton.type = "button";
  const acceso = checklistDeCadenas(elegidas, (ok) => { guardarBoton.disabled = !ok; });
  const guardar = () => { if (acceso.valido()) guardarFicha(usuario, campo.value, elegidas); };
  guardarBoton.addEventListener("click", guardar);
  campo.addEventListener("keydown", (evento) => {
    if (evento.key === "Enter") guardar();
    if (evento.key === "Escape") cerrar();
  });

  const pie = elemento("div", "pie-edicion");
  pie.append(boton(t("cancelar"), "tache", cerrar), guardarBoton);

  const zona = elemento("div", "zona-eliminar");
  const borrar = elemento("button", "eliminar-usuario");
  borrar.type = "button";
  borrar.append(icono("basura"), elemento("span", null, t("eliminar_usuario")));
  borrar.addEventListener("click", () => eliminar(usuario));
  zona.append(elemento("span", "explica", t("explica_eliminar")), borrar);

  datos.append(
    rotulo,
    campo,
    elemento("div", "pista", numeroLegible(usuario.numero)),
    acceso,
    pie,
    zona,
  );

  fila.append(columnaFoto, datos);
  // Enfocar despues de montar: sobre un nodo suelto no hace nada.
  queueMicrotask(() => campo.focus());
  return fila;
}

function fichaDeUsuario(usuario) {
  const fila = elemento("div", `persona ${usuario.estado === "activo" ? "" : "suspendida"}`.trim());
  const datos = elemento("div", "datos");
  const quien = elemento("div", "quien");
  quien.append(
    elemento("span", "nombre-persona", quienEs(usuario)),
    elemento("span", `pastilla ${usuario.estado}`, t("estado")[usuario.estado] || usuario.estado),
  );

  // Numero (si el titulo ya es el nombre) · ultimo mensaje · alta.
  const cuando = elemento("div", "cuando");
  const partes = [];
  if (usuario.nombre) partes.push(document.createTextNode(numeroLegible(usuario.numero)));
  const ultimo = ultimoMensajeDe(usuario.numero);
  if (ultimo) {
    const hoy = fecha(ultimo)?.toDateString() === new Date().toDateString();
    const cuandoFue = hoy ? `${t("hoy_corto")} ${horaCorta(ultimo)}` : fechaCorta(ultimo);
    partes.push(elemento("span", hoy ? "reciente" : null, t("ultimo_mensaje", cuandoFue)));
  } else {
    partes.push(document.createTextNode(t("sin_mensajes")));
  }
  partes.push(document.createTextNode(t("alta", fechaCorta(usuario.creado))));
  partes.forEach((parte, i) => {
    if (i) cuando.append(document.createTextNode(" · "));
    cuando.append(parte);
  });
  datos.append(quien, cuando, lineaDeAcceso(usuario));

  // Eliminar vive dentro de Editar: es lo unico que no tiene vuelta atras,
  // y en la fila quedaba a un clic, al lado de lo de todos los dias.
  const acciones = elemento("div", "acciones");
  acciones.append(
    boton(t("editar"), "lapiz", () => { editando = usuario.numero; pintarPersonas(); }),
  );
  if (usuario.estado === "activo") {
    acciones.append(boton(t("suspender"), "alto", () => suspender(usuario)));
  } else {
    acciones.append(
      boton(t("reactivar"), "palomita", () => cambiar("reactivar", { numero: usuario.numero }), "buena"),
    );
  }

  fila.append(avatar(usuario.numero, "", usuario.foto), datos, acciones);
  return fila;
}

function nombreDeCadena(clave) {
  return cacheCadenas.find((c) => c.clave === clave)?.nombre || clave;
}

// "Puede ver: Coppel · Elektra", o "Todas las cadenas".
function lineaDeAcceso(usuario) {
  const linea = elemento("div", "acceso");
  linea.append(elemento("span", "rotulo", t("puede_ver")));
  const cadenas = usuario.cadenas || [];
  if (!cadenas.length) {
    linea.append(elemento("span", "pastilla cadena", t("todas_las_cadenas")));
  } else {
    for (const clave of cadenas) {
      linea.append(elemento("span", "pastilla cadena limitada", nombreDeCadena(clave)));
    }
  }
  return linea;
}

// Una opcion por cadena, mas "Todas". Marcar todas a mano es lo mismo que
// "Todas": el servicio lo guarda como sin limite.
// Que cadenas puede ver: un interruptor de "Todas las cadenas" y, apagado,
// una casilla por cadena. `elegidas` es el Set que se edita (vacio = todas,
// igual que en el servicio). Devuelve el nodo y si lo elegido es valido:
// apagar "todas" sin marcar ninguna no es "todas", es un error.
function checklistDeCadenas(elegidas, alCambiar = () => {}) {
  const caja = elemento("div", "acceso-datos");
  caja.append(elemento("div", "titulo-acceso", t("acceso_a_datos")));

  let todas = elegidas.size === 0;
  const interruptor = elemento("button", "interruptor-todas");
  interruptor.type = "button";
  interruptor.setAttribute("role", "switch");
  interruptor.append(
    elemento("span", "riel"),
    elemento("span", null, t("todas_las_cadenas")),
    elemento("span", "detalle", t("todas_detalle")),
  );

  const casillas = elemento("div", "casillas-cadenas");
  casillas.setAttribute("role", "group");
  casillas.setAttribute("aria-label", t("puede_ver"));
  const PALOMA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 16.6 5.4 12.4 4 13.8l5.6 5.6L20 9l-1.4-1.4z"/></svg>';
  for (const cadena of cacheCadenas) {
    const etiqueta = elemento("label", "casilla-cadena");
    const marca = document.createElement("input");
    marca.type = "checkbox";
    marca.checked = elegidas.has(cadena.clave);
    marca.addEventListener("change", () => {
      if (marca.checked) elegidas.add(cadena.clave);
      else elegidas.delete(cadena.clave);
      pintar();
    });
    const cuadro = elemento("span", "caja");
    cuadro.innerHTML = PALOMA;
    etiqueta.append(marca, cuadro, elemento("span", null, cadena.nombre));
    casillas.append(etiqueta);
  }

  const pista = elemento("div", "pista");
  const valido = () => todas || elegidas.size > 0;
  const pintar = () => {
    interruptor.setAttribute("aria-checked", String(todas));
    casillas.hidden = todas;
    pista.hidden = todas;
    pista.className = `pista${valido() ? "" : " falta"}`;
    pista.textContent = valido() ? t("pista_cadenas") : t("marca_una");
    alCambiar(valido());
  };
  interruptor.addEventListener("click", () => {
    todas = !todas;
    if (todas) {
      elegidas.clear();
      for (const marca of casillas.querySelectorAll("input")) marca.checked = false;
    } else {
      // Al apagarlo, la primera casilla queda a la mano.
      queueMicrotask(() => casillas.querySelector("input")?.focus());
    }
    pintar();
  });

  caja.append(interruptor, casillas, pista);
  pintar();
  caja.valido = valido;
  return caja;
}

async function guardarFicha(usuario, nombre, elegidas) {
  editando = null;
  const cambioDeNombre = (nombre || "").trim() !== (usuario.nombre || "");
  // En el orden del servicio, para comparar con lo que ya tenia.
  const cadenas = cacheCadenas.map((c) => c.clave).filter((c) => elegidas.has(c));
  const cambioDeCadenas = cadenas.join(",") !== (usuario.cadenas || []).join(",");
  if (!cambioDeNombre && !cambioDeCadenas) return pintarPersonas();
  try {
    mostrarError("");
    const enviar = (accion, cuerpo) => pedir(`/panel/usuarios/${accion}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo),
    });
    if (cambioDeNombre) await enviar("renombrar", { numero: usuario.numero, nombre });
    if (cambioDeCadenas) await enviar("cadenas", { numero: usuario.numero, cadenas });
  } catch (error) {
    mostrarError(error.message);
  }
  await cargarUsuarios();
}

// El selector de archivos vive fuera de la fila: si se recrea con cada
// repintado, el dialogo del navegador se queda sin dueño a medio abrir.
const selectorDeFoto = document.createElement("input");
selectorDeFoto.type = "file";
selectorDeFoto.accept = "image/*";
selectorDeFoto.hidden = true;
document.body.append(selectorDeFoto);
let usuarioDeLaFoto = null;

function elegirFoto(usuario) {
  usuarioDeLaFoto = usuario;
  selectorDeFoto.value = "";
  selectorDeFoto.click();
}

selectorDeFoto.addEventListener("change", async () => {
  const archivo = selectorDeFoto.files?.[0];
  if (!archivo || !usuarioDeLaFoto) return;
  try {
    mostrarError("");
    const imagen = await new Promise((listo, falla) => {
      const lector = new FileReader();
      lector.onload = () => listo(String(lector.result));
      lector.onerror = () => falla(new Error(t("no_pude_leer")));
      lector.readAsDataURL(archivo);
    });
    await pedir("/panel/usuarios/foto", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ numero: usuarioDeLaFoto.numero, imagen }),
    });
    await cargarUsuarios();
  } catch (error) {
    mostrarError(error.message);
  }
});

         <rect x="10.5" y="2" width="2.7" height="10.4" rx="1.35"/>

         <path d="M6.4 10.6h13.4v4.6a6 6 0 0 1-6 6h-1.4a6 6 0 0 1-6-6z"/>`,
  tache: `<path d="M18.3 7.1 16.9 5.7 12 10.6 7.1 5.7 5.7 7.1l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/>`,

function icono(nombre) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "15");
  svg.setAttribute("height", "15");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = ICONOS[nombre];
  return svg;
}

function boton(etiqueta, nombreDeIcono, alHacerClic, tono = "") {
  const b = elemento("button", `accion ${tono}`.trim());
  b.type = "button";
  b.append(icono(nombreDeIcono), elemento("span", null, etiqueta));
  b.addEventListener("click", alHacerClic);
  return b;
}

async function cambiar(accion, cuerpo) {
  try {
    mostrarError("");
    await pedir(`/panel/usuarios/${accion}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo),
    });
    await cargarUsuarios();
  } catch (error) {
    mostrarError(error.message);
  }
}

function suspender(usuario) {
  const quien = usuario.nombre ? `${usuario.nombre} (${usuario.numero})` : usuario.numero;
  if (!confirm(t("confirmar_suspender", quien))) return;
  cambiar("suspender", { numero: usuario.numero });
}

function eliminar(usuario) {
  const quien = usuario.nombre ? `${usuario.nombre} (${usuario.numero})` : usuario.numero;
  if (!confirm(t("confirmar_eliminar", quien))) return;
  cambiar("eliminar", { numero: usuario.numero });
}

$("form-alta").addEventListener("submit", async (evento) => {
  evento.preventDefault();
  if (accesoDeAlta && !accesoDeAlta.valido()) {
    mostrarError(t("marca_una"));
    return;
  }
  try {
    mostrarError("");
    const alta = await pedir("/panel/usuarios", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ numero: $("alta-numero").value, nombre: $("alta-nombre").value }),
    });
    if (cadenasDeAlta.size) {
      await pedir("/panel/usuarios/cadenas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ numero: alta.usuario.numero, cadenas: [...cadenasDeAlta] }),
      });
      cadenasDeAlta.clear();
    }
    $("alta-numero").value = "";
    $("alta-nombre").value = "";
    await cargarUsuarios();

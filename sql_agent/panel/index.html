// Los dias vienen como AAAA-MM-DD. A mediodia para que la zona horaria no lo
// corra al dia anterior al convertirlo.
const isoDeDia = (dia) => `${dia}T12:00:00`;

// "Hoy", "Ayer" o "lunes 28 de septiembre". diaLargo da HOY/AYER en
// mayusculas, que es como se ven las etiquetas de fecha del chat; en un
// titulo o en la lista eso se lee como un grito.
function nombreDeDia(dia) {
  const momento = new Date(isoDeDia(dia));
  const hoy = new Date();
  const ayer = new Date(hoy);
  ayer.setDate(hoy.getDate() - 1);
  const capital = (texto) => texto.charAt(0).toUpperCase() + texto.slice(1).toLowerCase();
  if (momento.toDateString() === hoy.toDateString()) return capital(t("hoy"));
  if (momento.toDateString() === ayer.toDateString()) return capital(t("ayer"));
  return momento.toLocaleDateString(localeDeFecha(), { weekday: "long", day: "numeric", month: "long" });
}

function pintarListaDias(caja) {
  if (!cacheDias.length) {
    caja.append(elemento("div", "vacio", t("sin_logs")));

    const centro = elemento("div", "centro");

    arriba.append(
      elemento("span", "titulo", nombreDeDia(dia.dia)),

    );

    if (dia.avisos) abajo.append(elemento("span", "pastilla avisos", t("avisos_n", dia.avisos)));

    centro.append(arriba, abajo);
    fila.append(centro);
    fila.addEventListener("click", () => abrirLog(dia.dia).catch((e) => mostrarError(e.message)));

}

// Pone el numero en el circulo de una solapa (vacio = no se ve) y su
// explicacion como tooltip, para que un "2" rojo diga de que es.
const cuentas = {};
function ponerCuenta(cual, n) {
  cuentas[cual] = n;
  const circulo = $(`cuenta-${cual}`);
  circulo.textContent = n ? String(n > 99 ? "99+" : n) : "";
  const boton = $(`tab-${cual}`);
  if (n) boton.title = t(`cuenta_${cual}`, n);
  else boton.removeAttribute("title");
}

// Que reacciones cuentan como buena y como mala; las manda el servicio.
let reaccionesQueCuentan = { buenas: [], malas: [] };

// Que calificaciones habia la ultima vez, para notar cuando llega una.
let firmaCalif = null;

// Por que una calificacion no trae su pregunta: un mensaje que no quedo
// registrado (los de antes del 5/10/2026) o un turno que ya no esta.
function sinTurno(calif) {
  return String(calif.turno_id || "").startsWith("sin-registro:") ? "turno_sin_registro" : "turno_perdido";
}

async function cargarCalificaciones() {
  const consulta = filtroCalif ? `?valor=${filtroCalif}` : "";
  const datos = await pedir(`/panel/calificaciones${consulta}`);
  cacheCalif = datos.calificaciones;
  reaccionesQueCuentan = datos.reacciones || reaccionesQueCuentan;
  // Llego (o se quito) una reaccion: el chat abierto la muestra sin tener
  // que salir y volver a entrar.
  const firma = cacheCalif.map((c) => `${c.turno_id}${c.emoji}${c.fecha}`).join("|");
  const cambio = firmaCalif !== null && firma !== firmaCalif;
  firmaCalif = firma;
  if (cambio && vista === "chat" && chatElegido) await abrirChat(chatElegido);
  // En la pestaña, las malas: son las que piden revisar algo.
  ponerCuenta("calificaciones", datos.malas);
  if (solapa === "calificaciones") pintarLista();
}

function pintarListaCalif(caja) {
  const filtros = elemento("div", "filtros-calif");
  filtros.setAttribute("role", "group");
  const nombres = t("filtro_calif");
  for (const valor of ["-1", "1", ""]) {
    const boton = elemento("button", null, nombres[valor]);
    boton.type = "button";
    boton.setAttribute("aria-pressed", String(valor === filtroCalif));
    boton.addEventListener("click", () => {

      cargarCalificaciones().catch((e) => mostrarError(e.message));
    });
    filtros.append(boton);
  }
  caja.append(filtros);
  // Que reacciones cuentan en el filtro elegido: con "Malas" solo las
  // malas, con "Buenas" solo las buenas, y con "Todas" nada (las dos listas
  // juntas eran un parrafo de emojis que no se leia).
  const { buenas, malas } = reaccionesQueCuentan;
  const cuentan = filtroCalif === "-1" ? malas : filtroCalif === "1" ? buenas : [];
  if (cuentan.length) {
    const clave = filtroCalif === "-1" ? "leyenda_malas" : "leyenda_buenas";
    const leyenda = elemento("div", "leyenda-calif", t(clave));
    // El servicio las manda sin selector de variante (asi las compara), y
    // ❤, ☹ o ⚠ sin el se pintan como texto en blanco y negro.
    const enColor = (e) => (e.codePointAt(0) < 0x3000 ? `${e}\uFE0F` : e);
    leyenda.append(elemento("span", "emojis", cuentan.map(enColor).join(" ")));
    caja.append(leyenda);
  }

  const visibles = cacheCalif.filter((c) => soloNumero(c.chat_id).includes(filtro));
  if (!visibles.length) {

      elemento("span", "titulo", ficha?.nombre || soloNumero(calif.chat_id)),
      elemento("span", "hora", diaLargo(calif.fecha)),
    );
    const abajo = elemento("div", "abajo");
    abajo.append(elemento("span", "vista-previa", calif.turno?.pregunta || t(sinTurno(calif))));
    centro.append(arriba, abajo);
    fila.append(elemento("div", "avatar calif", calif.emoji), centro);
    fila.addEventListener("click", () => abrirCalificacion(calif));
    caja.append(fila);
  }
}

// `alFinal`: al abrir un dia o cambiar un filtro se baja hasta lo mas nuevo.
// En los refrescos solo si ya se estaba abajo, para no arrancarle la lectura
// a quien subio a mirar algo.
async function cargarLog(alFinal = false) {
  if (!diaElegido) return;
  const parametros = new URLSearchParams({ dia: diaElegido, limite: "2000" });
  if (fuenteLog) parametros.set("fuente", fuenteLog);
  if (soloProblemas) parametros.set("solo_problemas", "true");
  const datos = await pedir(`/panel/logs?${parametros}`);
  lineasLog = datos.lineas;
  totalLog = datos.total;
  pintarLog(alFinal);
}

function pintarLog(alFinal = false) {
  const caja = $("lineas-log");
  const estabaAbajo = caja.scrollHeight - caja.scrollTop - caja.clientHeight < 40;
  const visibles = filtroLog
    ? lineasLog.filter((linea) => linea.texto.toLowerCase().includes(filtroLog))
    : lineasLog;

  caja.replaceChildren();
  if (!visibles.length) {
    caja.append(
      elemento("div", "vacio", lineasLog.length ? t("sin_lineas_filtro") : t("sin_lineas")),
    );
  }
  for (const linea of visibles) {
    const fila = elemento("div", `linea ${linea.nivel}`);
    fila.append(elemento("span", "hora", linea.hora), elemento("span", "texto", linea.texto));
    caja.append(fila);
  }
  $("contador-log").textContent = t("contador", visibles.length, totalLog);
  if (alFinal || estabaAbajo) caja.scrollTop = caja.scrollHeight;
}

const ICONOS_AJUSTE = {
  sol: `<circle cx="12" cy="12" r="4.4"/><path d="M12 1.6v3M12 19.4v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1.6 12h3M19.4 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>`,
  luna: `<path d="M20.7 14.6A8.6 8.6 0 0 1 9.4 3.3a8.9 8.9 0 1 0 11.3 11.3z"/>`,
  // Reloj: el modo que decide por la hora.
  reloj: `<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 6.8V12l3.4 2" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>`,
};

// La regla del modo automatico: oscuro de las 17:00 a las 07:00.
const HORA_OSCURA = 17;
const HORA_CLARA = 7;

function horaEnMexico() {
  // La hora de Mexico, no la del equipo: el bot es de GTM Honor Mexico y la
  // regla es sobre el horario de alla. Si alguien abre el panel desde una
  // maquina en otro huso, la ventana se oscurece cuando alla anochece.
  try {
    const partes = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Mexico_City",
      hour: "numeric",
      hourCycle: "h23",
    }).formatToParts(new Date());
    const hora = Number(partes.find((parte) => parte.type === "hour")?.value);
    if (Number.isFinite(hora)) return hora % 24;
  } catch (error) {
    /* sin esa zona horaria, se usa la del equipo */
  }
  return new Date().getHours();
}

function esDeNoche() {
  const hora = horaEnMexico();
  return hora >= HORA_OSCURA || hora < HORA_CLARA;
}

// Tres modos: por la hora (el de casa), siempre claro y siempre oscuro. La
// eleccion se recuerda; mientras nadie elija, manda el reloj.
const MODOS = ["horario", "claro", "oscuro"];
let tema = MODOS.includes(recordado("tema")) ? recordado("tema") : "horario";

const oscuroAhora = () => tema === "oscuro" || (tema === "horario" && esDeNoche());

function aplicarTema() {
  // Siempre explicito, incluso en automatico: si se dejara sin atributo, la
  // preferencia del sistema se colaria y pelearia con el reloj.
  document.documentElement.setAttribute("data-theme", oscuroAhora() ? "dark" : "light");

  const boton = $("boton-tema");
  boton.replaceChildren(
    iconoAjuste(tema === "horario" ? "reloj" : tema === "oscuro" ? "luna" : "sol"),
  );
  boton.title = t(`modo_${tema}`);
  boton.setAttribute("aria-label", boton.title);
  // El papel tapiz se dibuja con el color del tema: hay que rehacerlo.
  pintarPapelTapiz();
}

function iconoAjuste(nombre) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "14");
  svg.setAttribute("height", "14");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = ICONOS_AJUSTE[nombre];
  return svg;
}

function aplicarIdioma() {
  document.documentElement.lang = idioma;
  for (const nodo of document.querySelectorAll("[data-t]")) {
    nodo.textContent = t(nodo.dataset.t);
  }
  // Los tooltips de los numeros de las solapas, en el idioma nuevo.
  for (const [cual, n] of Object.entries(cuentas)) ponerCuenta(cual, n);
  for (const nodo of document.querySelectorAll("[data-t-ph]")) {
    nodo.placeholder = t(nodo.dataset.tPh);
  }
  for (const nodo of document.querySelectorAll("[data-t-aria]")) {
    nodo.setAttribute("aria-label", t(nodo.dataset.tAria));
  }
  $("buscar").placeholder = t(placeholderDeSolapa());
  $("alta-nombre").placeholder = idioma === "es" ? "Laura, ventas" : "Laura, sales";

  const boton = $("boton-idioma");
  boton.replaceChildren();
  for (const cual of ["es", "en"]) {
    boton.append(elemento("span", cual === idioma ? "activa" : "apagada", cual.toUpperCase()));
  }
  boton.title = t("cambiar_idioma");
  boton.setAttribute("aria-label", boton.title);

  // Lo ya pintado se rehace: la lista, el encabezado y la vista abierta.
  pintarLista();
  pintarResumen();
  if (vista === "usuarios") abrirUsuarios();
  else if (vista === "logs" && diaElegido) abrirLog(diaElegido).catch(() => {});
  else if (vista === "actividad") abrirActividad();
  else if (vista === "calificacion" && califElegida) abrirCalificacion(califElegida);
  else if (vista === "chat" && chatElegido) abrirChat(chatElegido).catch(() => {});
  else $("subtitulo-principal").textContent = t("elige");
}

function placeholderDeSolapa() {
  if (solapa === "usuarios") return "buscar_usuario";
  if (solapa === "logs") return "buscar_log";
  if (solapa === "chats") return "buscar_chats";
  return "buscar_numero";
}

function elegirSolapa(cual) {
  solapa = cual;
  $("tab-chats").setAttribute("aria-selected", String(cual === "chats"));
  $("tab-usuarios").setAttribute("aria-selected", String(cual === "usuarios"));
  $("tab-logs").setAttribute("aria-selected", String(cual === "logs"));
  $("tab-calificaciones").setAttribute("aria-selected", String(cual === "calificaciones"));
  // Cada solapa busca otra cosa (un numero, o un texto dentro del log): lo
  // escrito en una no tiene sentido en la otra.
  $("buscar").value = "";
  filtro = "";
  busqueda = "";
  resultadosTexto = null;
  resaltar = "";
  filtroLog = "";
  $("buscar").placeholder = t(placeholderDeSolapa());
  $("buscar").dataset.tPh = placeholderDeSolapa();
  pintarLista();
  if (cual === "usuarios") abrirUsuarios();

      .then(() => {

      })

      // releer la bitacora entera cada 100 ms.
      const pedido = busqueda;
      temporizadorBusqueda = setTimeout(() => buscarEnConversaciones(pedido), 300);

      resultadosTexto = [];
    }

async function latido() {
  if (document.hidden) return;
  try {
    const datos = await pedir("/panel/actividad");
    $("foco").className = "foco vivo";
    $("texto-estado").textContent = t("en_linea", datos.sesiones);

    if (tema === "horario" && oscuroAhora() !== eraDeNoche) {
      eraDeNoche = oscuroAhora();
      aplicarTema();
    }

    const antes = enCursoPorChat.size;
    enCursoPorChat = new Map(datos.en_curso.map((turno) => [turno.chat_id, turno]));
    ponerCuenta("chats", enCursoPorChat.size);
    if (vista === "actividad") pintarActividad(datos.en_curso);
    // El log de hoy se va escribiendo: se relee en cada latido mientras esta
    // abierto. La lista de dias y el contador de errores, cada 30 segundos.
    if (vista === "logs" && diaElegido && diaElegido === cacheDias[0]?.dia) {
      await cargarLog();
    }
    latidosDesdeDias += 1;
    if (latidosDesdeDias % 5 === 0) await cargarCalificaciones().catch(() => {});
    if (latidosDesdeDias >= 15) {
      latidosDesdeDias = 0;
      await cargarDias();
    }
    if (vista === "chat" && enCursoPorChat.has(chatElegido)) {
      $("subtitulo-principal").textContent = t("consultando");
    }
    // El historial solo se relee cuando algo empieza o termina: son archivos
    // en disco y nadie los cambia entre medias.
    if (enCursoPorChat.size !== antes) {
      await cargarChats();
      if (vista === "chat" && chatElegido && !enCursoPorChat.has(chatElegido)) {
        await abrirChat(chatElegido);
      }
    } else if (solapa === "chats") {
      pintarLista();
    }
  } catch (error) {
    $("foco").className = "foco muerto";
    $("texto-estado").textContent = t("sin_conexion");
  }
}

$("boton-tema").addEventListener("click", () => {
  tema = MODOS[(MODOS.indexOf(tema) + 1) % MODOS.length];

$("boton-idioma").addEventListener("click", () => {

// En automatico, el panel se oscurece solo al dar la hora: se comprueba en
// cada latido, que ya corre cada dos segundos, en vez de montar otro reloj.
let eraDeNoche = oscuroAhora();

/* ------------------------------------------------ deslizar para actualizar */

// Todo de nuevo: usuarios, conversaciones, calificaciones y dias, y lo que
// este abierto a la derecha.
async function refrescarPanel() {
  const cargas = [cargarUsuarios(), cargarChats(), cargarCalificaciones(), cargarDias()];
  const resultados = await Promise.allSettled(cargas);
  const fallo = resultados.find((r) => r.status === "rejected");
  mostrarError(fallo ? fallo.reason.message : "");
  if (vista === "chat" && chatElegido) await abrirChat(chatElegido);
  else if (vista === "calificacion" && califElegida) {
    abrirCalificacion(cacheCalif.find((c) => c.turno_id === califElegida.turno_id) || califElegida);
  } else if (vista === "logs" && diaElegido) await cargarLog();
}

const recarga = elemento("div", "recarga");
recarga.setAttribute("role", "status");
recarga.setAttribute("aria-live", "polite");
recarga.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>';
document.body.append(recarga);
const ARCO = 2 * Math.PI * 9;
const UMBRAL = 72;      // lo que hay que jalar para que actualice
const TOPE = 112;       // hasta donde baja el circulo
let actualizando = false;

function ponerRecarga(caja, jalado) {
  const marco = caja.getBoundingClientRect();
  const bajada = Math.min(jalado, TOPE);
  recarga.classList.remove("volviendo");
  recarga.classList.toggle("listo", jalado >= UMBRAL);
  recarga.style.left = `${marco.left + marco.width / 2}px`;
  recarga.style.top = `${marco.top - 40}px`;
  recarga.style.opacity = String(Math.min(1, jalado / UMBRAL));
  recarga.style.transform = `translateY(${bajada}px) rotate(${jalado * 2.5}deg)`;
  // El arco se completa conforme se jala: lleno = suelta y actualiza.
  const circulo = recarga.querySelector("circle");
  circulo.style.strokeDasharray = `${ARCO}`;
  circulo.style.strokeDashoffset = `${ARCO * (1 - Math.min(1, jalado / UMBRAL) * 0.85)}`;
}

function esconderRecarga() {
  recarga.classList.add("volviendo");
  recarga.classList.remove("girando", "listo");
  recarga.style.opacity = "0";
  recarga.style.transform = "translateY(0)";
  recarga.removeAttribute("aria-label");
}

async function soltarRecarga(caja, jalado) {
  if (jalado < UMBRAL || actualizando) {
    if (!actualizando) esconderRecarga();
    return;
  }
  actualizando = true;
  ponerRecarga(caja, UMBRAL);
  recarga.classList.add("volviendo", "girando");
  recarga.setAttribute("aria-label", t("actualizando"));
  recarga.querySelector("circle").style.strokeDashoffset = `${ARCO * 0.7}`;
  const desde = performance.now();
  try {
    await refrescarPanel();
  } finally {
    // Un minimo de giro: si contesta en 50 ms, el circulo ni se veria y no
    // quedaria claro que actualizo.
    const falta = 450 - (performance.now() - desde);
    if (falta > 0) await new Promise((r) => setTimeout(r, falta));
    actualizando = false;
    esconderRecarga();
  }
}

function deslizarParaActualizar(caja) {
  // Con el dedo: jalar hacia abajo estando hasta arriba.
  let inicio = null;
  let jalado = 0;
  caja.addEventListener("touchstart", (e) => {
    inicio = caja.scrollTop <= 0 && !actualizando ? e.touches[0].clientY : null;
    jalado = 0;
  }, { passive: true });
  caja.addEventListener("touchmove", (e) => {
    if (inicio === null) return;
    const recorrido = e.touches[0].clientY - inicio;
    if (recorrido <= 0 || caja.scrollTop > 0) { jalado = 0; esconderRecarga(); return; }
    jalado = recorrido * 0.55;  // con resistencia, como en el telefono
    ponerRecarga(caja, jalado);
    e.preventDefault();
  }, { passive: false });
  caja.addEventListener("touchend", () => {
    if (inicio !== null) soltarRecarga(caja, jalado);
    inicio = null;
    jalado = 0;
  });

  // Con el trackpad o la rueda: seguir subiendo cuando ya se esta arriba.
  // Solo cuenta si el gesto EMPEZO arriba: la inercia de subir rapido por
  // un chat largo no debe disparar una actualizacion al tocar el tope.
  let rueda = 0;
  let empezoArriba = false;
  let ultimoGiro = 0;
  let pausa = null;
  caja.addEventListener("wheel", (e) => {
    const ahora = performance.now();
    if (ahora - ultimoGiro > 250) {
      empezoArriba = caja.scrollTop <= 0;
      rueda = 0;
    }
    ultimoGiro = ahora;
    if (!empezoArriba || actualizando || caja.scrollTop > 0 || e.deltaY >= 0) return;
    rueda += Math.min(60, -e.deltaY) * 0.45;
    ponerRecarga(caja, rueda);
    clearTimeout(pausa);
    pausa = setTimeout(() => { soltarRecarga(caja, rueda); rueda = 0; }, 220);
  }, { passive: true });
}

for (const id of ["lista", "vista-chat", "vista-actividad", "vista-calificacion", "vista-usuarios", "lineas-log"]) {
  deslizarParaActualizar($(id));
}

async function arranque() {
  aplicarTema();
  aplicarIdioma();
  try {
    await cargarUsuarios();
    await cargarChats();
  } catch (error) {
    mostrarError(error.message);
  }

  // El contador de errores de la pestaña Logs se ve desde el principio. Que
  // falle no puede tumbar el resto del panel.
  await cargarDias().catch(() => {});
  await cargarCalificaciones().catch(() => {});

  const destino = location.hash.slice(1);
  if (destino === "usuarios") elegirSolapa("usuarios");
  else if (destino === "calificaciones") elegirSolapa("calificaciones");
  else if (destino === "logs" || destino.startsWith("logs=")) {
    diaElegido = destino.slice(5) || null;
    elegirSolapa("logs");
  }
  else if (destino === "actividad") abrirActividad();
  else if (destino.startsWith("chat=")) {
    const numero = destino.slice(5);
    const chat = cacheChats.find((c) => soloNumero(c.chat_id) === numero);
    if (chat) await abrirChat(chat.chat_id).catch((e) => mostrarError(e.message));
  }

  await latido();
  setInterval(latido, 2000);
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) latido(); });
arranque();
